services:
  db:
    image: postgres:16-alpine
    container_name: absen-qr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-absen_qr}
      POSTGRES_USER: ${POSTGRES_USER:-absen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-absen} -d ${POSTGRES_DB:-absen_qr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: absen-qr-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-absen}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-absen_qr}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set to the public HTTPS origin in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: absen-qr-frontend
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    container_name: absen-qr-proxy
    restart: unless-stopped
    ports:
      - "${PUBLIC_BIND_IP:-127.0.0.1}:${HTTPS_PORT:?HTTPS_PORT must be set to a non-default host port}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - nginx_certs:/etc/nginx/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  nginx_certs:

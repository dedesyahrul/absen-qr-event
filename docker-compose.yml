services:
  db:
    image: postgres:16-alpine
    container_name: absen-qr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-absen_qr}
      POSTGRES_USER: ${POSTGRES_USER:-absen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-absen_dev_password}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-absen} -d ${POSTGRES_DB:-absen_qr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: absen-qr-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-absen}:${POSTGRES_PASSWORD:-absen_dev_password}@db:5432/${POSTGRES_DB:-absen_qr}
      CORS_ORIGINS: "*"
      JWT_SECRET: "gatherly-production-secret-change-me"
    ports:
      - "${BACKEND_PORT:-18081}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: absen-qr-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-18082}:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: absen-qr-nginx
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - nginx_certs:/etc/nginx/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  frontend_modules:
  nginx_certs:

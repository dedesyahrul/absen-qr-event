services:
  db:
    image: postgres:16-alpine
    container_name: absen-qr-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-absen_qr}
      POSTGRES_USER: ${POSTGRES_USER:-absen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-absen} -d ${POSTGRES_DB:-absen_qr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: absen-qr-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-absen}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-absen_qr}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:${FRONTEND_PORT:-18082},http://localhost:${FRONTEND_PORT:-18082},https://127.0.0.1:${HTTPS_PORT:-18443},https://localhost:${HTTPS_PORT:-18443}}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18081}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: absen-qr-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18082}:80"
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    container_name: absen-qr-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTPS_PORT:-18443}:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - nginx_certs:/etc/nginx/certs
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  nginx_certs:
